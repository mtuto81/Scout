name: Linux Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt
          python -m pip install pyinstaller

      - name: Validate Python files
        run: |
          python -m py_compile agent.py tool_manager.py config.py app_metadata.py gui_app.py gui/main_windows.py gui/agent_worker.py gui/updater.py build_linux_executable.py install_linux_desktop.py packaging/linux/create_installer.py

      - name: Build executable
        run: |
          python build_linux_executable.py

      - name: Package executable
        run: |
          tar -C dist -czf Scout-linux-x86_64.tar.gz Scout
          sha256sum Scout-linux-x86_64.tar.gz > Scout-linux-x86_64.tar.gz.sha256
          python packaging/linux/create_installer.py Scout-linux-x86_64.tar.gz Scout-linux-x86_64-installer.run
          sha256sum Scout-linux-x86_64-installer.run > Scout-linux-x86_64-installer.run.sha256
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="$(cat VERSION)"; fi
          SHA256="$(cut -d ' ' -f 1 Scout-linux-x86_64.tar.gz.sha256)"
          INSTALLER_SHA256="$(cut -d ' ' -f 1 Scout-linux-x86_64-installer.run.sha256)"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Scout-linux-x86_64.tar.gz"
          INSTALLER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Scout-linux-x86_64-installer.run"
          python - <<PY
          import json
          data = {
              "name": "Scout",
              "version": "${VERSION}",
              "platform": "linux-x86_64",
              "release_url": "${RELEASE_URL}",
              "download_url": "${DOWNLOAD_URL}",
              "sha256": "${SHA256}",
              "installer_url": "${INSTALLER_URL}",
              "installer_sha256": "${INSTALLER_SHA256}",
          }
          with open("latest.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\\n")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scout-linux-x86_64
          path: |
            Scout-linux-x86_64.tar.gz
            Scout-linux-x86_64.tar.gz.sha256
            Scout-linux-x86_64-installer.run
            Scout-linux-x86_64-installer.run.sha256
            latest.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Scout Linux Installer

            Download this file:

            `Scout-linux-x86_64-installer.run`

            Then run:

            ```bash
            chmod +x Scout-linux-x86_64-installer.run
            ./Scout-linux-x86_64-installer.run
            ```

            The `.tar.gz` file is for portable/manual installs and in-app updates.
          files: |
            Scout-linux-x86_64.tar.gz
            Scout-linux-x86_64.tar.gz.sha256
            Scout-linux-x86_64-installer.run
            Scout-linux-x86_64-installer.run.sha256
            latest.json
